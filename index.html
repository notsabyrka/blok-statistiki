<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блок статистики</title>
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <section class="cards">
      <h1 class="visually-hidden">Блок статистики</h1>
      <ul class="cards__list">
        <li class="cards__item">
          <article class="card">
            <div class="card__header">
              <div class="card__header-label">Подписчики</div>
              <div class="card__header-indicator card__header-indicator--violet"></div>
            </div>
            <h2 class="card__title">12K</h2>
            <div class="card__footer">
              <div class="card__footer-key">За 30 дней</div>
              <div class="card__footer-value">+12%</div>
            </div>
          </article>
        </li>
        <li class="cards__item">
          <article class="card">
            <div class="card__header">
              <div class="card__header-label">Подписчики</div>
              <div class="card__header-indicator card__header-indicator--orange"></div>
            </div>
            <h2 class="card__title">87K</h2>
            <div class="card__footer">
              <div class="card__footer-key">За неделю</div>
              <div class="card__footer-value">+4%</div>
            </div>
          </article>
        </li>
        <li class="cards__item">
          <article class="card">
            <div class="card__header">
              <div class="card__header-label">Подписчики</div>
              <div class="card__header-indicator card__header-indicator--green"></div>
            </div>
            <h2 class="card__title">324</h2>
            <div class="card__footer">
              <div class="card__footer-key">За месяц</div>
              <div class="card__footer-value">+18%</div>
            </div>
          </article>
        </li>
      </ul>
    </section>
  </body>
</html>
